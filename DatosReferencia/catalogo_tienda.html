<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Pedidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #F7F3EE;
      --bg-alt: #EDE8E1;
      --card: #FFFFFF;
      --text: #1C1917;
      --text-sec: #78716C;
      --accent: #2D6A4F;
      --accent-hover: #1B4332;
      --accent-light: #D8F3DC;
      --accent-glow: rgba(45,106,79,0.15);
      --border: #E7E0D8;
      --danger: #DC2626;
      --gold: #D97706;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .font-display { font-family: 'Playfair Display', serif; }

    /* Scrollbar personalizado */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-sec); }

    /* Animaciones */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideInRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    @keyframes slideOutRight {
      from { transform: translateX(0); }
      to { transform: translateX(100%); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes toastIn {
      from { transform: translateX(120%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes toastOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(120%); opacity: 0; }
    }
    @keyframes pulse-badge {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.35); }
    }
    @keyframes heroBlob {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
    }
    @keyframes checkDraw {
      from { stroke-dashoffset: 48; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes scaleIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .animate-fade-in-up { animation: fadeInUp 0.5s ease both; }
    .animate-fade-in { animation: fadeIn 0.3s ease both; }
    .animate-slide-right { animation: slideInRight 0.35s cubic-bezier(0.16,1,0.3,1) both; }
    .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1) both; }
    .animate-toast-in { animation: toastIn 0.4s cubic-bezier(0.16,1,0.3,1) both; }
    .animate-toast-out { animation: toastOut 0.3s ease both; }
    .animate-pulse-badge { animation: pulse-badge 0.4s ease; }
    .animate-scale-in { animation: scaleIn 0.5s cubic-bezier(0.16,1,0.3,1) both; }

    /* Cards de producto */
    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.16,1,0.3,1), box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(28,25,23,0.08), 0 4px 12px rgba(28,25,23,0.04);
    }
    .product-card .img-wrap {
      position: relative;
      padding-top: 100%;
      background: var(--bg-alt);
      overflow: hidden;
    }
    .product-card .img-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .product-card:hover .img-wrap img { transform: scale(1.06); }
    .product-card .badge-linea {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .linea-economica { background: #FEF3C7; color: #92400E; }
    .linea-estandar { background: #DBEAFE; color: #1E40AF; }
    .linea-premium { background: #FDE68A; color: #78350F; }

    /* Botón agregar */
    .btn-add {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }
    .btn-add:hover { background: var(--accent-hover); }
    .btn-add:active { transform: scale(0.97); }

    /* Controles de cantidad en card */
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 0;
      border: 2px solid var(--accent);
      border-radius: 10px;
      overflow: hidden;
      width: 100%;
    }
    .qty-controls button {
      background: var(--accent-light);
      color: var(--accent);
      border: none;
      width: 40px;
      height: 40px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
    }
    .qty-controls button:hover { background: var(--accent); color: #fff; }
    .qty-controls span {
      flex: 1;
      text-align: center;
      font-weight: 700;
      font-size: 16px;
      color: var(--accent);
      background: #fff;
      height: 40px;
      line-height: 40px;
    }

    /* Filtros sidebar */
    .filter-section h3 {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-sec);
      margin-bottom: 10px;
    }
    .filter-check {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      cursor: pointer;
      font-size: 14px;
      color: var(--text);
      transition: color 0.15s;
    }
    .filter-check:hover { color: var(--accent); }
    .filter-check input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .filter-check input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .filter-check input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 6px;
      height: 10px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .filter-radio {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      cursor: pointer;
      font-size: 14px;
      color: var(--text);
      transition: color 0.15s;
    }
    .filter-radio:hover { color: var(--accent); }
    .filter-radio input[type="radio"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .filter-radio input[type="radio"]:checked {
      border-color: var(--accent);
    }
    .filter-radio input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 3px;
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
    }

    /* Drawer carrito */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(28,25,23,0.4);
      backdrop-filter: blur(4px);
      z-index: 90;
      animation: fadeIn 0.3s ease both;
    }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 420px;
      max-width: 100vw;
      height: 100vh;
      background: var(--card);
      z-index: 100;
      display: flex;
      flex-direction: column;
      box-shadow: -8px 0 40px rgba(0,0,0,0.1);
    }

    /* Panel filtros móvil */
    .mobile-filter-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 80vh;
      background: var(--card);
      z-index: 80;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -8px 40px rgba(0,0,0,0.12);
      overflow-y: auto;
    }
    .mobile-filter-overlay {
      position: fixed;
      inset: 0;
      background: rgba(28,25,23,0.4);
      z-index: 79;
      animation: fadeIn 0.2s ease both;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 80px;
      right: 16px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: var(--text);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Hero blobs */
    .hero-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: heroBlob 12s ease-in-out infinite;
    }

    /* Input estilos */
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      color: var(--text);
      background: #fff;
      transition: border-color 0.2s;
      outline: none;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: #B8B0A6; }

    /* Botón primario */
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 2px solid var(--border);
      padding: 12px 24px;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-outline:hover { border-color: var(--text); background: var(--bg); }

    .btn-whatsapp {
      background: #25D366;
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-whatsapp:hover { background: #1DA851; }
    .btn-whatsapp:active { transform: scale(0.97); }

    /* Stagger en cards */
    .product-card:nth-child(1) { animation-delay: 0ms; }
    .product-card:nth-child(2) { animation-delay: 40ms; }
    .product-card:nth-child(3) { animation-delay: 80ms; }
    .product-card:nth-child(4) { animation-delay: 120ms; }
    .product-card:nth-child(5) { animation-delay: 160ms; }
    .product-card:nth-child(6) { animation-delay: 200ms; }
    .product-card:nth-child(7) { animation-delay: 240ms; }
    .product-card:nth-child(8) { animation-delay: 280ms; }
    .product-card:nth-child(n+9) { animation-delay: 320ms; }

    /* Tags de filtro activo */
    .active-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--accent-light);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .active-tag button {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      line-height: 1;
      opacity: 0.7;
      transition: opacity 0.15s;
    }
    .active-tag button:hover { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 768px) {
      .drawer { width: 100vw; }
    }
  </style>
</head>
<body>
  <!-- Contenedor principal SPA -->
  <div id="app"></div>
  <!-- Contenedor de toasts -->
  <div class="toast-container" id="toasts"></div>

  <script>
    // ========================================================
    // CONFIGURACIÓN — Cambia el número de WhatsApp aquí
    // ========================================================
    const WHATSAPP_NUMERO = '5215512345678';
    const NOMBRE_TIENDA = 'Distribuidora El Sol';

    // ========================================================
    // DATOS DEL CATÁLOGO
    // ========================================================
    const PRODUCTOS = [
      { id: 1, nombre: 'Arroz Blanco Grano Largo 1kg', categoria: 'Abarrotes', linea: 'Estándar', precio: 28.50, unidad: 'bolsa', img: 'arroz1' },
      { id: 2, nombre: 'Frijol Negro 1kg', categoria: 'Abarrotes', linea: 'Estándar', precio: 34.00, unidad: 'bolsa', img: 'frijol2' },
      { id: 3, nombre: 'Aceite de Oliva Extra Virgen 500ml', categoria: 'Abarrotes', linea: 'Premium', precio: 189.00, unidad: 'botella', img: 'aceite3' },
      { id: 4, nombre: 'Harina de Trigo 1kg', categoria: 'Abarrotes', linea: 'Económica', precio: 18.00, unidad: 'bolsa', img: 'harina4' },
      { id: 5, nombre: 'Pasta Espagueti 500g', categoria: 'Abarrotes', linea: 'Económica', precio: 14.50, unidad: 'paquete', img: 'pasta5' },
      { id: 6, nombre: 'Agua Mineral Sin Gas 1.5L', categoria: 'Bebidas', linea: 'Estándar', precio: 12.00, unidad: 'botella', img: 'agua6' },

      { id: 9, nombre: 'Café Molido de Altura 500g', categoria: 'Bebidas', linea: 'Premium', precio: 135.00, unidad: 'bolsa', img: 'cafe9' },
      { id: 10, nombre: 'Té Verde Orgánico 20 bolsas', categoria: 'Bebidas', linea: 'Premium', precio: 68.00, unidad: 'caja', img: 'te10' },
      { id: 11, nombre: 'Detergente en Polvo 1kg', categoria: 'Limpieza', linea: 'Estándar', precio: 42.00, unidad: 'bolsa', img: 'deter11' },
      { id: 12, nombre: 'Suavizante de Telas 1L', categoria: 'Limpieza', linea: 'Estándar', precio: 38.00, unidad: 'botella', img: 'suav12' },
      { id: 13, nombre: 'Cloro Multiusos 1L', categoria: 'Limpieza', linea: 'Económica', precio: 18.50, unidad: 'botella', img: 'cloro13' },
      { id: 14, nombre: 'Limpiador de Pisos Lavanda 1L', categoria: 'Limpieza', linea: 'Estándar', precio: 35.00, unidad: 'botella', img: 'piso14' },
      { id: 15, nombre: 'Jabón Líquido para Lavadora 3L', categoria: 'Limpieza', linea: 'Premium', precio: 129.00, unidad: 'botella', img: 'jabon15' },
      { id: 16, nombre: 'Jabón de Tocador Avena 150g', categoria: 'Cuidado Personal', linea: 'Estándar', precio: 22.00, unidad: 'barra', img: 'jabon16' },
      { id: 17, nombre: 'Champú Anticaspa 400ml', categoria: 'Cuidado Personal', linea: 'Estándar', precio: 65.00, unidad: 'botella', img: 'champu17' },
      { id: 18, nombre: 'Crema Corporal Hidratante 400ml', categoria: 'Cuidado Personal', linea: 'Premium', precio: 158.00, unidad: 'frasco', img: 'crema18' },
      { id: 19, nombre: 'Pasta Dental Anticaries 100ml', categoria: 'Cuidado Personal', linea: 'Económica', precio: 32.00, unidad: 'tubo', img: 'pasta19' },
      { id: 20, nombre: 'Desodorante Roll-on 50ml', categoria: 'Cuidado Personal', linea: 'Estándar', precio: 48.00, unidad: 'pieza', img: 'deso20' },
      { id: 21, nombre: 'Galletas de Chocolate 200g', categoria: 'Snacks y Dulces', linea: 'Estándar', precio: 25.00, unidad: 'paquete', img: 'galleta21' },
      { id: 22, nombre: 'Cacahuates Salados 150g', categoria: 'Snacks y Dulces', linea: 'Económica', precio: 15.00, unidad: 'bolsa', img: 'caca22' },
      { id: 23, nombre: 'Barra de Granola y Frutas 40g', categoria: 'Snacks y Dulces', linea: 'Premium', precio: 18.00, unidad: 'pieza', img: 'grano23' },
      { id: 24, nombre: 'Chicles de Menta 60 piezas', categoria: 'Snacks y Dulces', linea: 'Económica', precio: 12.00, unidad: 'paquete', img: 'chicle24' },
    ];

    const CATEGORIAS = ['Abarrotes', 'Bebidas', 'Limpieza', 'Cuidado Personal', 'Snacks y Dulces'];
    const LINEAS = ['Económica', 'Estándar', 'Premium'];
    const RANGOS_PRECIO = [
      { label: 'Todos los precios', value: null },
      { label: 'Hasta $25', value: [0, 25] },
      { label: '$25 a $50', value: [25, 50] },
      { label: '$50 a $150', value: [50, 150] },
      { label: 'Más de $150', value: [150, Infinity] },
    ];

    const ICONOS_CATEGORIA = {
      'Abarrotes': 'fa-basket-shopping',
      'Bebidas': 'fa-glass-water',
      'Limpieza': 'fa-spray-can-sparkles',
      'Cuidado Personal': 'fa-pump-soap',
      'Snacks y Dulces': 'fa-cookie-bite',
    };

    // ========================================================
    // ESTADO GLOBAL
    // ========================================================
    const state = {
      vista: 'catalogo', // catalogo | checkout | confirmacion
      carrito: JSON.parse(localStorage.getItem('pedido_carrito') || '[]'),
      filtros: {
        categoria: [],
        linea: [],
        precio: null,
        busqueda: '',
        orden: 'relevancia',
      },
      showCarrito: false,
      showFiltrosMovil: false,
      ultimoPedido: null,
    };

    // ========================================================
    // UTILIDADES
    // ========================================================
    function fmt(n) {
      return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function getProductImg(seed) {
      return `https://picsum.photos/seed/${seed}/400/400.jpg`;
    }

    function lineaClass(linea) {
      return 'linea-' + linea.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    // ========================================================
    // PERSISTENCIA DEL CARRITO
    // ========================================================
    function guardarCarrito() {
      localStorage.setItem('pedido_carrito', JSON.stringify(state.carrito));
    }

    // ========================================================
    // ACCIONES DEL CARRITO
    // ========================================================
    function agregarAlCarrito(id) {
      const existente = state.carrito.find(i => i.id === id);
      if (existente) {
        existente.cantidad++;
      } else {
        state.carrito.push({ id, cantidad: 1 });
      }
      guardarCarrito();
      const prod = PRODUCTOS.find(p => p.id === id);
      mostrarToast(`${prod.nombre} agregado`);
      render();
    }

    function cambiarCantidad(id, delta) {
      const item = state.carrito.find(i => i.id === id);
      if (!item) return;
      item.cantidad += delta;
      if (item.cantidad <= 0) {
        state.carrito = state.carrito.filter(i => i.id !== id);
      }
      guardarCarrito();
      render();
    }

    function eliminarDelCarrito(id) {
      state.carrito = state.carrito.filter(i => i.id !== id);
      guardarCarrito();
      render();
    }

    function vaciarCarrito() {
      state.carrito = [];
      guardarCarrito();
      render();
    }

    function getCarritoCount() {
      return state.carrito.reduce((s, i) => s + i.cantidad, 0);
    }

    function getCarritoTotal() {
      return state.carrito.reduce((s, i) => {
        const prod = PRODUCTOS.find(p => p.id === i.id);
        return s + (prod ? prod.precio * i.cantidad : 0);
      }, 0);
    }

    function getCantidadEnCarrito(id) {
      const item = state.carrito.find(i => i.id === id);
      return item ? item.cantidad : 0;
    }

    // ========================================================
    // FILTRADO Y ORDENAMIENTO
    // ========================================================
    function getProductosFiltrados() {
      let res = [...PRODUCTOS];
      const f = state.filtros;

      // Búsqueda
      if (f.busqueda.trim()) {
        const q = f.busqueda.toLowerCase().trim();
        res = res.filter(p =>
          p.nombre.toLowerCase().includes(q) ||
          p.categoria.toLowerCase().includes(q) ||
          p.linea.toLowerCase().includes(q)
        );
      }
      // Categoría (OR)
      if (f.categoria.length > 0) {
        res = res.filter(p => f.categoria.includes(p.categoria));
      }
      // Línea (OR)
      if (f.linea.length > 0) {
        res = res.filter(p => f.linea.includes(p.linea));
      }
      // Precio
      if (f.precio) {
        const [min, max] = f.precio;
        res = res.filter(p => p.precio >= min && (max === Infinity ? true : p.precio <= max));
      }
      // Ordenar
      switch (f.orden) {
        case 'precio-asc': res.sort((a, b) => a.precio - b.precio); break;
        case 'precio-desc': res.sort((a, b) => b.precio - a.precio); break;
        case 'nombre-asc': res.sort((a, b) => a.nombre.localeCompare(b.nombre)); break;
        case 'nombre-desc': res.sort((a, b) => b.nombre.localeCompare(a.nombre)); break;
      }
      return res;
    }

    function hayFiltrosActivos() {
      const f = state.filtros;
      return f.categoria.length > 0 || f.linea.length > 0 || f.precio !== null || f.busqueda.trim() !== '';
    }

    function limpiarFiltros() {
      state.filtros = { categoria: [], linea: [], precio: null, busqueda: '', orden: 'relevancia' };
      render();
    }

    function quitarFiltroCategoria(cat) {
      state.filtros.categoria = state.filtros.categoria.filter(c => c !== cat);
      render();
    }
    function quitarFiltroLinea(lin) {
      state.filtros.linea = state.filtros.linea.filter(l => l !== lin);
      render();
    }
    function quitarFiltroPrecio() {
      state.filtros.precio = null;
      render();
    }

    // ========================================================
    // TOASTS
    // ========================================================
    function mostrarToast(mensaje) {
      const container = document.getElementById('toasts');
      const toast = document.createElement('div');
      toast.className = 'toast animate-toast-in';
      toast.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#4ADE80"></i> ${mensaje}`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.className = 'toast animate-toast-out';
        setTimeout(() => toast.remove(), 300);
      }, 2200);
    }

    // ========================================================
    // NAVEGACIÓN
    // ========================================================
    function navegar(vista) {
      state.vista = vista;
      state.showCarrito = false;
      state.showFiltrosMovil = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function toggleCarrito() {
      state.showCarrito = !state.showCarrito;
      state.showFiltrosMovil = false;
      render();
    }

    function toggleFiltrosMovil() {
      state.showFiltrosMovil = !state.showFiltrosMovil;
      state.showCarrito = false;
      render();
    }

    // ========================================================
    // ENVÍO DE PEDIDO
    // ========================================================
    function enviarPedido(datos) {
      // Generar número de pedido
      const num = 'PED-' + Date.now().toString(36).toUpperCase().slice(-6);
      const pedido = { ...datos, numero: num, items: [...state.carrito], total: getCarritoTotal(), fecha: new Date().toLocaleString('es-MX') };
      state.ultimoPedido = pedido;

      // Guardar historial local (últimos 20)
      const historial = JSON.parse(localStorage.getItem('pedido_historial') || '[]');
      historial.unshift(pedido);
      localStorage.setItem('pedido_historial', JSON.stringify(historial.slice(0, 20)));

      // Vaciar carrito
      state.carrito = [];
      guardarCarrito();
      navegar('confirmacion');
    }

    function enviarPorWhatsApp(datos) {
      const num = 'PED-' + Date.now().toString(36).toUpperCase().slice(-6);
      let texto = `*NUEVO PEDIDO ${num}*\n`;
      texto += `*${NOMBRE_TIENDA}*\n`;
      texto += `_${new Date().toLocaleDateString('es-MX')}_\n\n`;
      texto += `*Cliente:* ${datos.nombre}\n`;
      texto += `*Teléfono:* ${datos.telefono}\n`;
      texto += `*Entrega:* ${datos.entrega}\n`;
      if (datos.direccion) texto += `*Dirección:* ${datos.direccion}\n`;
      if (datos.referencias) texto += `*Referencias:* ${datos.referencias}\n`;
      texto += `\n*── PRODUCTOS ──*\n`;
      state.carrito.forEach(item => {
        const prod = PRODUCTOS.find(p => p.id === item.id);
        if (prod) {
          texto += `▸ ${prod.nombre} x${item.cantidad} ${prod.unidad} = ${fmt(prod.precio * item.cantidad)}\n`;
        }
      });
      texto += `\n*TOTAL: ${fmt(getCarritoTotal())}*\n`;
      if (datos.notas) texto += `\n*Notas:* ${datos.notas}\n`;

      const pedido = { ...datos, numero: num, items: [...state.carrito], total: getCarritoTotal(), fecha: new Date().toLocaleString('es-MX') };
      state.ultimoPedido = pedido;
      const historial = JSON.parse(localStorage.getItem('pedido_historial') || '[]');
      historial.unshift(pedido);
      localStorage.setItem('pedido_historial', JSON.stringify(historial.slice(0, 20)));
      state.carrito = [];
      guardarCarrito();

      window.open(`https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(texto)}`, '_blank');
      navegar('confirmacion');
    }

    // ========================================================
    // RENDERIZADO PRINCIPAL
    // ========================================================
    function render() {
      const app = document.getElementById('app');
      let html = '';

      // Header siempre visible
      html += renderHeader();

      // Vista principal
      switch (state.vista) {
        case 'catalogo': html += renderCatalogo(); break;
        case 'checkout': html += renderCheckout(); break;
        case 'confirmacion': html += renderConfirmacion(); break;
      }

      // Drawer del carrito (overlay)
      if (state.showCarrito) {
        html += renderCarritoDrawer();
      }

      // Panel filtros móvil
      if (state.showFiltrosMovil) {
        html += renderFiltrosMovil();
      }

      app.innerHTML = html;

      // Enfocar búsqueda si estamos en catálogo
      if (state.vista === 'catalogo') {
        const searchInput = document.getElementById('search-input');
        if (searchInput && document.activeElement !== searchInput) {
          // No robar el foco si el usuario ya está en otro campo
        }
      }
    }

          <div style="padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
            <div>
              <h2 style="font-size:18px;font-weight:800;">Tu pedido</h2>
              <div style="font-size:13px;color:var(--text-sec);">${getCarritoCount()} producto${getCarritoCount() !== 1 ? 's' : ''}</div>
            </div>
            <button onclick="toggleCarrito()" style="background:none;border:none;cursor:pointer;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-sec);transition:all 0.15s;"
              onmouseenter="this.style.background='var(--bg)';this.style.color='var(--text)'"
              onmouseleave="this.style.background='none';this.style.color='var(--text-sec)'"
              aria-label="Cerrar carrito">
              <i class="fa-solid fa-xmark" style="font-size:20px;"></i>
            </button>
          </div>

          ${vacio ? `
            <!-- Estado vacío -->
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;">
              <i class="fa-solid fa-cart-shopping" style="font-size:48px;color:var(--border);margin-bottom:16px;"></i>
              <h3 style="font-size:16px;font-weight:700;margin-bottom:6px;">Tu pedido está vacío</h3>
              <p style="font-size:14px;color:var(--text-sec);margin-bottom:24px;">Agrega productos desde el catálogo</p>
              <button onclick="toggleCarrito()" class="btn-primary" style="padding:10px 24px;font-size:14px;">Ver catálogo</button>
            </div>
          ` : `
            <!-- Lista de items -->
            <div style="flex:1;overflow-y:auto;padding:16px 20px;">
              ${state.carrito.map(item => {
                const prod = PRODUCTOS.find(p => p.id === item.id);
                if (!prod) return '';
                return `
                  <div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:center;" class="animate-fade-in">
                    <div style="width:56px;height:56px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--bg-alt);">
                      <img src="${getProductImg(prod.img)}" alt="" style="width:100%;height:100%;object-fit:cover;" loading="lazy">
                    </div>
                    <div style="flex:1;min-width:0;">
                      <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(prod.nombre)}</div>
                      <div style="font-size:12px;color:var(--text-sec);">${fmt(prod.precio)} / ${prod.unidad}</div>
                      <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
                        <div style="display:flex;align-items:center;border:1.5px solid var(--border);border-radius:6px;overflow:hidden;">
                          <button onclick="cambiarCantidad(${prod.id},-1)" style="background:none;border:none;width:28px;height:28px;cursor:pointer;font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;" aria-label="Reducir cantidad">−</button>
                          <span style="width:28px;text-align:center;font-size:13px;font-weight:700;">${item.cantidad}</span>
                          <button onclick="cambiarCantidad(${prod.id},1)" style="background:none;border:none;width:28px;height:28px;cursor:pointer;font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;" aria-label="Aumentar cantidad">+</button>
                        </div>
                        <span style="font-size:14px;font-weight:700;color:var(--accent);">${fmt(prod.precio * item.cantidad)}</span>
                      </div>
                    </div>
                    <button onclick="eliminarDelCarrito(${prod.id})" style="background:none;border:none;cursor:pointer;color:var(--text-sec);padding:4px;transition:color 0.15s;"
                      onmouseenter="this.style.color='var(--danger)'" onmouseleave="this.style.color='var(--text-sec)'"
                      aria-label="Eliminar ${escHtml(prod.nombre)}">
                      <i class="fa-solid fa-trash-can" style="font-size:13px;"></i>
                    </button>
                  </div>`;
              }).join('')}
            </div>

            <!-- Footer del drawer -->
            <div style="padding:20px;border-top:1px solid var(--border);flex-shrink:0;background:var(--card);">
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;">
                <span style="font-size:14px;color:var(--text-sec);font-weight:500;">Total del pedido</span>
                <span style="font-size:24px;font-weight:900;color:var(--accent);letter-spacing:-0.02em;">${fmt(getCarritoTotal())}</span>
              </div>
              <button onclick="state.showCarrito=false;navegar('checkout')" class="btn-primary" style="width:100%;margin-bottom:10px;">
                <i class="fa-solid fa-clipboard-list"></i> Finalizar pedido
              </button>
              <button onclick="vaciarCarrito()" style="width:100%;background:none;border:none;color:var(--danger);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;padding:8px;transition:opacity 0.15s;"
                onmouseenter="this.style.opacity='0.7'" onmouseleave="this.style.opacity='1'">
                Vaciar pedido
              </button>
            </div>
          `}
        </div>`;
    }

    // ========================================================
    // FILTROS MÓVIL
    // ========================================================
    function renderFiltrosMovil() {
      return `
        <div class="mobile-filter-overlay" onclick="toggleFiltrosMovil()"></div>
        <div class="mobile-filter-panel animate-slide-up" role="dialog" aria-label="Filtros">
          <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:2;border-radius:20px 20px 0 0;">
            <h2 style="font-size:16px;font-weight:700;">Filtros</h2>
            <button onclick="toggleFiltrosMovil()" style="background:none;border:none;cursor:pointer;width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-sec);" aria-label="Cerrar filtros">
              <i class="fa-solid fa-xmark" style="font-size:18px;"></i>
            </button>
          </div>
          <div style="padding:20px;">
            ${renderFiltrosContenido()}
          </div>
          <div style="padding:16px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card);">
            <button onclick="toggleFiltrosMovil()" class="btn-primary" style="width:100%;">
              Ver ${getProductosFiltrados().length} producto${getProductosFiltrados().length !== 1 ? 's' : ''}
            </button>
          </div>
        </div>`;
    }

    // ========================================================
    // VISTA CHECKOUT
    // ========================================================
    function renderCheckout() {
      if (state.carrito.length === 0) {
        navegar('catalogo');
        return '';
      }
      return `
        <div style="max-width:960px;margin:0 auto;padding:32px 20px 60px;" class="animate-fade-in-up">
          <button onclick="navegar('catalogo')" style="background:none;border:none;cursor:pointer;color:var(--text-sec);font-family:'Outfit',sans-serif;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;margin-bottom:24px;transition:color 0.15s;"
            onmouseenter="this.style.color='var(--text)'" onmouseleave="this.style.color='var(--text-sec)'">
            <i class="fa-solid fa-arrow-left"></i> Volver al catálogo
          </button>

          <h1 style="font-size:28px;font-weight:900;margin-bottom:4px;letter-spacing:-0.02em;">Finalizar pedido</h1>
          <p style="color:var(--text-sec);margin-bottom:32px;">Completa tus datos para enviar el pedido.</p>

          <div style="display:grid;grid-template-columns:1fr;gap:28px;" class="lg:grid-cols-checkout">
            <!-- Formulario -->
            <div>
              <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;">
                <h2 style="font-size:16px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:8px;">
                  <i class="fa-solid fa-user" style="color:var(--accent);font-size:14px;"></i> Datos de contacto
                </h2>
                <form id="checkout-form" onsubmit="return manejarSubmit(event)">
                  <div style="display:grid;gap:16px;">
                    <div>
                      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Nombre completo *</label>
                      <input type="text" name="nombre" class="form-input" placeholder="Tu nombre" required>
                    </div>
                    <div>
                      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Teléfono *</label>
                      <input type="tel" name="telefono" class="form-input" placeholder="(555) 123-4567" required>
                    </div>
                    <div>
                      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Método de entrega *</label>
                      <select name="entrega" class="form-input" required>
                        <option value="">Selecciona una opción</option>
                        <option value="Entrega a domicilio">Entrega a domicilio</option>
                        <option value="Recoger en tienda">Recoger en tienda</option>
                      </select>
                    </div>
                    <div id="direccion-field" style="display:none;">
                      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Dirección de entrega *</label>
                      <input type="text" name="direccion" class="form-input" placeholder="Calle, número, colonia, CP">
                    </div>
                    <div>
                      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Referencias adicionales</label>
                      <input type="text" name="referencias" class="form-input" placeholder="Punto de referencia, color de casa, etc.">
                    </div>
                    <div>
                      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Notas del pedido</label>
                      <textarea name="notas" class="form-input" rows="3" placeholder="Instrucciones especiales, preferencias..." style="resize:vertical;min-height:80px;"></textarea>
                    </div>
                  </div>
                </form>
              </div>
            </div>

            <!-- Resumen -->
            <div>
              <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;position:sticky;top:90px;">
                <h2 style="font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;">
                  <i class="fa-solid fa-receipt" style="color:var(--accent);font-size:14px;"></i> Resumen del pedido
                </h2>
                <div style="max-height:280px;overflow-y:auto;margin-bottom:16px;">
                  ${state.carrito.map(item => {
                    const prod = PRODUCTOS.find(p => p.id === item.id);
                    if (!prod) return '';
                    return `
                      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">
                        <div style="flex:1;min-width:0;">
                          <div style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(prod.nombre)}</div>
                          <div style="color:var(--text-sec);font-size:12px;">${item.cantidad} x ${fmt(prod.precio)}</div>
                        </div>
                        <div style="font-weight:700;flex-shrink:0;margin-left:8px;">${fmt(prod.precio * item.cantidad)}</div>
                      </div>`;
                  }).join('')}
                </div>
                <div style="display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;border-top:2px solid var(--text);">
                  <span style="font-size:15px;font-weight:700;">Total</span>
                  <span style="font-size:26px;font-weight:900;color:var(--accent);letter-spacing:-0.02em;">${fmt(getCarritoTotal())}</span>
                </div>
                <div style="display:flex;flex-direction:column;gap:10px;margin-top:20px;">
                  <button onclick="manejarSubmit(null, 'whatsapp')" class="btn-whatsapp" style="width:100%;">
                    <i class="fa-brands fa-whatsapp" style="font-size:18px;"></i> Enviar por WhatsApp
                  </button>
                  <button onclick="manejarSubmit(null, 'directo')" class="btn-primary" style="width:100%;">
                    <i class="fa-solid fa-paper-plane"></i> Registrar pedido
                  </button>
                </div>
                <p style="font-size:11px;color:var(--text-sec);text-align:center;margin-top:12px;">
                  Al enviar, tu pedido quedará registrado localmente.
                </p>
              </div>
            </div>
          </div>
        </div>
        <style>.lg\:grid-cols-checkout{grid-template-columns:1fr 380px;}@media(max-width:1023px){.lg\:grid-cols-checkout{grid-template-columns:1fr;}}</style>`;
    }

    // Manejador de submit del formulario
    window.manejarSubmit = function(e, modo) {
      if (e) e.preventDefault();
      const form = document.getElementById('checkout-form');
      if (!form) return false;

      // Validar campos requeridos
      const nombre = form.nombre.value.trim();
      const telefono = form.telefono.value.trim();
      const entrega = form.entrega.value;

      if (!nombre || !telefono || !entrega) {
        // Mostrar error inline
        if (!nombre) form.nombre.style.borderColor = 'var(--danger)';
        if (!telefono) form.telefono.style.borderColor = 'var(--danger)';
        if (!entrega) form.entrega.style.borderColor = 'var(--danger)';
        mostrarToast('Completa los campos obligatorios');
        return false;
      }

      const datos = {
        nombre,
        telefono,
        entrega,
        direccion: form.direccion?.value.trim() || '',
        referencias: form.referencias?.value.trim() || '',
        notas: form.notas?.value.trim() || '',
      };

      if (modo === 'whatsapp') {
        enviarPorWhatsApp(datos);
      } else {
        enviarPedido(datos);
      }
      return false;
    };

    // Toggle campo dirección según método de entrega
    document.addEventListener('change', function(e) {
      if (e.target.name === 'entrega') {
        const dirField = document.getElementById('direccion-field');
        if (dirField) {
          dirField.style.display = e.target.value === 'Entrega a domicilio' ? 'block' : 'none';
          if (e.target.value === 'Entrega a domicilio') {
            dirField.querySelector('input').required = true;
          }
        }
      }
      // Reset border color on input
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
        e.target.style.borderColor = '';
      }
    });

    // ========================================================
    // VISTA CONFIRMACIÓN
    // ========================================================
    function renderConfirmacion() {
      const pedido = state.ultimoPedido;
      if (!pedido) { navegar('catalogo'); return ''; }

      return `
        <div style="max-width:640px;margin:0 auto;padding:60px 20px;text-align:center;" class="animate-scale-in">
          <!-- Ícono de éxito -->
          <div style="width:88px;height:88px;border-radius:50%;background:var(--accent-light);margin:0 auto 24px;display:flex;align-items:center;justify-content:center;">
            <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
              <circle cx="22" cy="22" r="20" stroke="var(--accent)" stroke-width="3" opacity="0.2"/>
              <path d="M13 22 L19 28 L31 16" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                style="stroke-dasharray:48;stroke-dashoffset:0;animation:checkDraw 0.6s ease 0.3s both;"/>
            </svg>
          </div>

          <h1 style="font-size:28px;font-weight:900;margin-bottom:8px;letter-spacing:-0.02em;">Pedido registrado</h1>
          <p style="color:var(--text-sec);font-size:16px;margin-bottom:4px;">Tu número de pedido es:</p>
          <div style="font-size:24px;font-weight:900;color:var(--accent);margin-bottom:24px;letter-spacing:0.05em;">${pedido.numero}</div>

          <!-- Resumen compacto -->
          <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;text-align:left;margin-bottom:24px;">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px;margin-bottom:16px;">
              <div>
                <div style="color:var(--text-sec);font-size:12px;font-weight:500;margin-bottom:2px;">Cliente</div>
                <div style="font-weight:600;">${escHtml(pedido.nombre)}</div>
              </div>
              <div>
                <div style="color:var(--text-sec);font-size:12px;font-weight:500;margin-bottom:2px;">Teléfono</div>
                <div style="font-weight:600;">${escHtml(pedido.telefono)}</div>
              </div>
              <div>
                <div style="color:var(--text-sec);font-size:12px;font-weight:500;margin-bottom:2px;">Entrega</div>
                <div style="font-weight:600;">${escHtml(pedido.entrega)}</div>
              </div>
              <div>
                <div style="color:var(--text-sec);font-size:12px;font-weight:500;margin-bottom:2px;">Fecha</div>
                <div style="font-weight:600;">${pedido.fecha}</div>
              </div>
            </div>
            <div style="border-top:1px solid var(--border);padding-top:12px;">
              ${pedido.items.map(item => {
                const prod = PRODUCTOS.find(p => p.id === item.id);
                if (!prod) return '';
                return `<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;">
                  <span>${escHtml(prod.nombre)} x${item.cantidad}</span>
                  <span style="font-weight:600;">${fmt(prod.precio * item.cantidad)}</span>
                </div>`;
              }).join('')}
              <div style="display:flex;justify-content:space-between;font-size:16px;font-weight:800;padding-top:8px;margin-top:8px;border-top:2px solid var(--text);">
                <span>Total</span>
                <span style="color:var(--accent);">${fmt(pedido.total)}</span>
              </div>
            </div>
          </div>

          <button onclick="navegar('catalogo')" class="btn-primary" style="padding:14px 40px;">
            <i class="fa-solid fa-arrow-rotate-left"></i> Hacer otro pedido
          </button>
        </div>`;
    }

    // ========================================================
    // ESCAPE HTML
    // ========================================================
    function escHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ========================================================
    // INICIALIZACIÓN
    // ========================================================
    render();

    // Manejar tecla Escape para cerrar drawer/panel
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        if (state.showCarrito) { toggleCarrito(); }
        else if (state.showFiltrosMovil) { toggleFiltrosMovil(); }
      }
    });
  </script>
</body>
</html>
